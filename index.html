<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trainingslog</title>
<meta name="description" content="Trainingstracker mit Steigerungsvorschlägen, Verlaufskurven, Körperwerten und Phasen.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f1f3f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1116" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Trainingslog">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
@font-face { font-family: "Inter"; src: url("inter.woff2") format("woff2"); font-weight: 100 900; font-display: swap }
@font-face { font-family: "Space Grotesk"; src: url("space-grotesk.woff2") format("woff2"); font-weight: 300 700; font-display: swap }
[hidden] { display: none !important }
html { -webkit-text-size-adjust: 100% }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px) }
/* Layout: eine schmale Spalte wie ein Trainingsheft; oben Tabs, darunter pro Übung ein Block mit Satz-Zeilen. */
:root {
  --bg: #f1f3f7; --surface: #ffffff; --sunken: #e8ebf1; --ink: #151a22; --muted: #5a6474; --line: #d6dbe4;
  --accent: #2447d6; --accent-ink: #ffffff; --accent-soft: #e4e9fb;
  --good: #17754a; --good-soft: #dff3e8; --warn: #8a5a00; --warn-soft: #f8ecd0; --bad: #b3261e; --dot: #e0a000; --scrim: rgba(21, 26, 34, .5);
  --c1: #2447d6; --c2: #b4530a; --c3: #17754a; --c4: #8b3fc7; --c5: #b3265c; --c6: #0b7285; --c-ink: #ffffff;
  --ph-cut: #e8590c; --ph-bulk: #2b8a3e; --ph-maint: #868e96;
  --display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1116; --surface: #171b22; --sunken: #1f242d; --ink: #e9ecf1; --muted: #9aa4b3; --line: #2b313c;
  --accent: #8ea5ff; --accent-ink: #0c1124; --accent-soft: #1d2647;
  --good: #62d39b; --good-soft: #143325; --warn: #e8b85a; --warn-soft: #3a2c0c; --bad: #ff8a80; --dot: #f5c542; --scrim: rgba(0, 0, 0, .66);
  --c1: #8ea5ff; --c2: #f0a868; --c3: #62d39b; --c4: #c79bf2; --c5: #f28fb1; --c6: #66c9d9; --c-ink: #0e1116; --ph-cut: #ff9254; --ph-bulk: #69db7c; --ph-maint: #adb5bd; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0e1116; --surface: #171b22; --sunken: #1f242d; --ink: #e9ecf1; --muted: #9aa4b3; --line: #2b313c;
  --accent: #8ea5ff; --accent-ink: #0c1124; --accent-soft: #1d2647;
  --good: #62d39b; --good-soft: #143325; --warn: #e8b85a; --warn-soft: #3a2c0c; --bad: #ff8a80; --dot: #f5c542; --scrim: rgba(0, 0, 0, .66);
  --c1: #8ea5ff; --c2: #f0a868; --c3: #62d39b; --c4: #c79bf2; --c5: #f28fb1; --c6: #66c9d9; --c-ink: #0e1116; --ph-cut: #ff9254; --ph-bulk: #69db7c; --ph-maint: #adb5bd; color-scheme: dark }

* { box-sizing: border-box }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); font-variant-numeric: tabular-nums; -webkit-tap-highlight-color: transparent }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg) }
.wrap { max-width: 760px; margin: 0 auto; padding-block: 20px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 16px }
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; line-height: 1.2 }
h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.01em }
h2 { font-size: 18px; font-weight: 600 }
h3 { font-size: 16px; font-weight: 600 }
p { margin: 0 }
.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap }
.sync { font-size: 12px; color: var(--muted) }
.sync.err { color: var(--bad) }
.profrow { flex-direction: row; align-items: center; gap: 10px; font-size: 13px }
.profrow select { width: auto; flex: 0 1 240px }
.tabs button { position: relative }
.tabs button.new::after { content: ""; position: absolute; top: 5px; right: 1px; width: 7px; height: 7px; border-radius: 50%; background: var(--dot) }
.overlay { position: fixed; inset: 0; z-index: 20; background: var(--scrim); display: flex; align-items: center; justify-content: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)) }
.sheet { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; width: min(420px, 100%); max-height: 100%; overflow: hidden; display: flex; flex-direction: column; gap: 14px }
.sheet > * { flex: none }
.sheet h2 { font-size: 22px }
.sheet > .stack { display: flex; flex-direction: column; gap: 8px; flex: 0 1 auto; min-height: 0; overflow-y: auto; padding: 3px; margin: -3px }
.stack > * { flex: none }
.whobtn { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 16px; font-size: 17px; text-align: left }
.whobtn span { font-size: 13px; font-weight: 500; opacity: .85 }
.newsitem { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 12px; text-align: left; font-weight: 400; line-height: 1.45 }
.tag { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted) }
.tag::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--dot) }
button:disabled { opacity: .4; cursor: default }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px }
.cal .wd { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); text-align: center; padding-bottom: 2px }
.calday { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; min-height: 52px; padding: 6px 2px; border-radius: 8px; border: 1px solid transparent; background: var(--sunken); color: var(--muted); font-weight: 500 }
.calday .num { font-size: 13px; line-height: 1 }
.calday.has { color: var(--ink); font-weight: 600 }
.calday.today { border-color: var(--accent) }
.calday.sel { background: var(--accent-soft); border-color: var(--accent) }
.pill { display: inline-block; padding: 3px 5px; border-radius: 5px; font-size: 10.5px; font-weight: 700; line-height: 1; letter-spacing: .02em; color: var(--c-ink); background: var(--muted) }
.pill.c1 { background: var(--c1) } .pill.c2 { background: var(--c2) } .pill.c3 { background: var(--c3) }
.pill.c4 { background: var(--c4) } .pill.c5 { background: var(--c5) } .pill.c6 { background: var(--c6) }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px }
.legend span { display: inline-flex; align-items: center; gap: 6px }
.caldet { display: flex; flex-direction: column; gap: 12px; padding-top: 12px; border-top: 1px solid var(--line) }
.calw { display: flex; flex-direction: column; gap: 4px }
.calw button { margin-top: 6px }
.calday { min-height: 62px }
.calday .kc { margin-top: auto; font-size: 10px; font-weight: 500; line-height: 1; color: var(--ink) }
.calday { position: relative; padding-top: 12px }
.band { position: absolute; top: 3px; left: -3px; right: -3px; height: 4px }
.band.s { left: 4px; border-top-left-radius: 2px; border-bottom-left-radius: 2px }
.band.e { right: 4px; border-top-right-radius: 2px; border-bottom-right-radius: 2px }
.calday.fut .band { opacity: .4 }
.ph-cut { background: var(--ph-cut) } .ph-bulk { background: var(--ph-bulk) } .ph-maintain { background: var(--ph-maint) }
.swatch { display: inline-block; width: 14px; height: 4px; border-radius: 2px; margin-right: 6px; vertical-align: middle }
.pick { display: flex; gap: 8px; flex-wrap: wrap; align-items: end; padding-top: 10px; border-top: 1px solid var(--line) }
.pick > label { flex: 1 1 220px }
.dupwarn { grid-column: 1 / -1; font-size: 13px; color: var(--warn) }
.dayhead { display: flex; align-items: center; gap: 10px; width: 100%; padding: 4px 0; border: 0; background: none; text-align: left; font: 600 17px var(--display); color: var(--ink) }
.dayhead .dayname { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere }
.dayhead .cnt { font: 500 13px var(--body); color: var(--muted); white-space: nowrap }
.chev { display: inline-block; width: 14px; text-align: center; font-size: 22px; line-height: 1; color: var(--muted) }
.dayhead[aria-expanded="true"] .chev { transform: rotate(90deg) }
.clip { white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
#exlist { gap: 0 }
.exrow { display: flex; flex-direction: column; gap: 8px; padding-block: 8px; border-top: 1px solid var(--line) }
.exrow:first-child { border-top: 0; padding-top: 0 }
.exrow:last-child { padding-bottom: 0 }
.exrow .planex { border-top: 0; padding-top: 0 }
.dayhead.exhead2 { font: 600 15px var(--body) }
.exsep { margin: 0; padding: 14px 0 6px; border-top: 1px solid var(--line); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted) }
.calday.past .kc { color: var(--muted) }
.pill.plan { background: none; color: var(--muted); box-shadow: inset 0 0 0 1px var(--muted) }
.pill.o { background: none; color: var(--muted); box-shadow: inset 0 0 0 1.5px var(--muted) }
.pill.o.c1 { color: var(--c1); box-shadow: inset 0 0 0 1.5px var(--c1) } .pill.o.c2 { color: var(--c2); box-shadow: inset 0 0 0 1.5px var(--c2) } .pill.o.c3 { color: var(--c3); box-shadow: inset 0 0 0 1.5px var(--c3) }
.pill.o.c4 { color: var(--c4); box-shadow: inset 0 0 0 1.5px var(--c4) } .pill.o.c5 { color: var(--c5); box-shadow: inset 0 0 0 1.5px var(--c5) } .pill.o.c6 { color: var(--c6); box-shadow: inset 0 0 0 1.5px var(--c6) }
.calday.sch { color: var(--ink); font-weight: 600 }
.lab { display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 500; color: var(--muted) }

.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; gap: 4px; background: var(--bg); padding-block: 6px; overflow-x: auto }
.tabs button { flex: 1 1 auto; white-space: nowrap; border-radius: 0; padding: 10px 6px; border: 0; border-bottom: 2px solid var(--line); background: none; color: var(--muted);
  font: 600 14px var(--body); cursor: pointer }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent) }

section.tab { display: flex; flex-direction: column; gap: 16px }
.block { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0 }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: end }
.row > * { min-width: 0 }
.muted { color: var(--muted) }
.small { font-size: 13px }
.empty { color: var(--muted); padding: 8px 0 }
.note { font-size: 13px; color: var(--warn); background: var(--warn-soft); border-radius: 8px; padding: 8px 10px }

label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 500; color: var(--muted) }
input, select { font: 16px var(--body); color: var(--ink); background: var(--sunken); border: 1px solid transparent; border-radius: 8px; padding: 9px 10px; width: 100%; min-width: 0 }
input::placeholder { color: var(--muted); opacity: .7 }
input:focus-visible, select:focus-visible, button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px }
textarea { font: 16px/1.4 var(--body); color: var(--ink); background: var(--sunken); border: 1px solid transparent; border-radius: 8px; padding: 9px 10px; width: 100%; min-width: 0; resize: vertical }
.pvlist { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 2px; font-size: 14px }
button { font: 600 14px var(--body); border-radius: 8px; cursor: pointer; padding: 10px 14px; border: 1px solid var(--line); background: var(--surface); color: var(--ink) }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink) }
button.ghost { border-color: transparent; background: none; color: var(--accent); padding: 8px 6px }
button.danger { color: var(--bad) }

.chips { display: flex; gap: 6px; flex-wrap: wrap }
.chips button { padding: 7px 12px; border-radius: 999px; font-weight: 500 }
.chips button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink) }

.exhead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap }
.hint { align-self: flex-start; font-size: 13px; font-weight: 600; padding: 4px 9px; border-radius: 6px }
.hint.up { background: var(--good-soft); color: var(--good) }
.hint.hold { background: var(--accent-soft); color: var(--ink) }
.hint.low { background: var(--warn-soft); color: var(--warn) }
.sets { display: grid; grid-template-columns: 2.2em 1fr 1fr; gap: 8px; align-items: center }
.sets .hd { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted) }
.sets .n { color: var(--muted); font-weight: 600; text-align: center }

.stats { display: flex; gap: 20px; flex-wrap: wrap }
.stats div { display: flex; flex-direction: column }
.stats b { font: 600 20px var(--display) }
.stats span { font-size: 12px; color: var(--muted) }

.chart svg { width: 100%; height: auto; display: block }
.chart .grid { stroke: var(--line); stroke-width: 1 }
.chart .ln { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round }
.chart .ar { fill: var(--accent); opacity: .12 }
.chart .pt { fill: var(--surface); stroke: var(--accent); stroke-width: 2 }
.chart .end { fill: var(--accent) }
.chart text { fill: var(--muted); font: 12px var(--body) }
.chart text.val { fill: var(--ink); font-weight: 600; font-size: 13px }
.chart .mk { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 4 }
.chart text.mkt { font-size: 11px; font-weight: 600 }

.tablewrap { overflow-x: auto }
table { border-collapse: collapse; width: 100%; font-size: 14px }
th, td { text-align: left; padding: 7px 10px 7px 0; border-bottom: 1px solid var(--line); white-space: nowrap }
th { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600 }
td.r, th.r { text-align: right; padding: 7px 0 7px 14px }
.macro th, .macro td { text-align: right; padding: 7px 8px }
.macro th:first-child, .macro td:first-child { text-align: left; padding-left: 0 }
.macro .on { background: var(--accent-soft); color: var(--ink); font-weight: 600 }
td button { padding: 4px 8px; font-size: 13px }

.planex { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr auto; gap: 8px; align-items: end; padding-top: 10px; border-top: 1px solid var(--line) }
.planex .name { grid-column: 1 / -1 }
@media (min-width: 620px) { .planex { grid-template-columns: 2.4fr 1fr 1fr 1fr 1fr auto } .planex .name { grid-column: auto } }
@media (prefers-reduced-motion: no-preference) { button { transition: background-color .12s, border-color .12s } }
button, select, input { touch-action: manipulation }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>Trainingslog</h1>
    <span class="sync" id="sync" role="status">Lade deine Daten …</span>
  </div>
  <label class="profrow" id="profrow" hidden>Profil<select id="profsel"></select></label>

  <div class="tabs" role="tablist">
    <button role="tab" data-tab="train" aria-selected="true">Training</button>
    <button role="tab" data-tab="prog" aria-selected="false">Fortschritt</button>
    <button role="tab" data-tab="body" aria-selected="false">Körper</button>
    <button role="tab" data-tab="plan" aria-selected="false">Plan</button>
    <button role="tab" data-tab="data" aria-selected="false">Daten</button>
  </div>

  <div id="notice" class="note" hidden></div>

  <section class="tab" id="tab-train"><p class="empty">Hier erscheint dein Trainingstag mit allen Übungen, sobald deine Daten geladen sind.</p></section>
  <section class="tab" id="tab-prog" hidden></section>
  <section class="tab" id="tab-body" hidden></section>
  <section class="tab" id="tab-plan" hidden></section>
  <section class="tab" id="tab-data" hidden></section>
</div>

<div class="overlay" id="who" role="dialog" aria-modal="true" aria-labelledby="who-h" hidden>
  <div class="sheet">
    <h2 id="who-h">Wer trainiert?</h2>
    <div class="stack" id="who-list"></div>
  </div>
</div>
<div class="overlay" id="news" role="dialog" aria-modal="true" aria-labelledby="news-h" hidden>
  <div class="sheet">
    <h2 id="news-h">Was ist neu?</h2>
    <p class="small muted">Tippe auf einen Eintrag, um direkt zum Reiter zu springen.</p>
    <div class="stack" id="news-list"></div>
    <button class="primary" data-act="newsok">Verstanden</button>
  </div>
</div>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
  var num = function (s) { s = String(s == null ? "" : s).trim().replace(",", "."); if (s === "") return null; var n = parseFloat(s); return isFinite(n) ? n : null; };
  var fmt = function (n) { return n == null ? "–" : String(Math.round(n * 100) / 100).replace(".", ","); };
  var pad = function (n) { return (n < 10 ? "0" : "") + n; };
  var today = function () { var d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); };
  var dfmt = function (s, yr) { var p = s.split("-"); return p[2] + "." + p[1] + "." + (yr ? p[0].slice(2) : ""); };
  var rid = function (p) { return p + Math.random().toString(36).slice(2, 8); };
  var clone = function (o) { return JSON.parse(JSON.stringify(o)); };

  var S = { ready: false, plan: null, workouts: {}, body: {}, phases: [], person: null, sched: {}, tab: "train", date: today(), dayId: null, exSel: null, metric: "e1rm", bodyMetric: "weight" };
  var draft = null, dirty = false, saveTimer = null, planTimer = null;
  var DOCS = {}, persistAsked = false;
  /* Profile: mehrere Personen auf einem Gerät. Das erste Profil ("main") nutzt die ursprünglichen Speicherschlüssel. */
  var PROF = { active: "main", main: "main", list: [{ id: "main", name: "Profil 1" }] };
  /* Neuerungen: Bei jeder Änderung an der App APP_VERSION um 1 erhöhen und unten einen Eintrag mit dem
     betroffenen Reiter (train, prog, body, plan, data) ergänzen. Nach einem Update zeigt die App die neuen
     Einträge einmal an und markiert die Reiter bis zum nächsten Öffnen mit einem gelben Punkt. */
  var APP_VERSION = 15;
  var CHANGES = [
    { v: 2, tab: "train", text: "Unter jeder Übung steht nach dem letzten Satz ein Vorschlag fürs nächste Mal." },
    { v: 2, tab: "body", text: "Kalorienempfehlung für Cut und Aufbau. Die Angaben dazu trägst du ganz unten ein." },
    { v: 2, tab: "data", text: "Profile für mehrere Personen auf diesem Gerät." },
    { v: 3, tab: "data", text: "Bei mehreren Profilen fragt die App beim Öffnen „Wer trainiert?“ und schlägt den Hauptnutzer vor. Den Hauptnutzer legst du unter „Profile“ fest." },
    { v: 3, tab: "data", text: "Neuerungen sind ab jetzt mit einem gelben Punkt am Reiter markiert. Die ganze Liste findest du unten unter „Was ist neu?“." },
    { v: 4, tab: "train", text: "Der Gewichtsvorschlag kommt jetzt mit unterschiedlichen Gewichten pro Satz zurecht: Er schlägt ein gemeinsames Arbeitsgewicht vor und rät zum Reduzieren, wenn ein Gewicht zu schwer war." },
    { v: 5, tab: "prog", text: "Kalender: zeigt pro Monat, an welchem Tag du welches Training gemacht hast. Ein Tipp auf einen Tag zeigt die Sätze. Er ersetzt die Liste „Letzte Einheiten“." },
    { v: 6, tab: "body", text: "Neuer Block „Kalorien und Makros“: Grundumsatz, Erhaltungskalorien und Eiweiß, Fett und Kohlenhydrate für Erhaltung, Cut und Aufbau. Die Angaben dazu trägst du ganz unten ein." },
    { v: 7, tab: "prog", text: "Der Kalender zeigt für jeden Tag deinen Kalorienbedarf, passend zur Phase und an Trainingstagen höher. Ein Tipp auf den Tag zeigt auch die Makros." },
    { v: 7, tab: "body", text: "Bei den Angaben ganz unten wählst du jetzt deine Trainingstage. Daraus ergeben sich getrennte Kalorien für Trainings- und Ruhetage." },

    else if (a === "dayall") {
      var anyOpen = S.plan.days.some(function (d) { return !planClosed[d.id]; });
      planClosed = {}; if (anyOpen) S.plan.days.forEach(function (d) { planClosed[d.id] = 1; });
      saveClosed(); renderPlan();
    }
    else if (a === "pickadd") { S.pick = S.pick || {}; pickAdd(+id); renderPlan(); var ps = $("pick-" + (+id)); if (ps) ps.focus(); }
    else if (a === "adde") { var e = { id: rid("e"), name: "Neue Übung", sets: 3, repMin: 8, repMax: 12, step: 2.5 }; S.plan.days[+id].exercises.push(e); planChanged(true); renderPlan(); var n = $("p-" + (+id) + "-" + e.id + "-name"); if (n) { n.focus(); n.select(); } }
    else if (a === "dele") { if (arm(b, "Sicher?")) { S.plan.days[+b.dataset.day].exercises.splice(+id, 1); planChanged(true); renderPlan(); } }
  });

  document.addEventListener("input", function (ev) {
    var t = ev.target, ds = t.dataset;
    if (t.id === "plancode") { S.planCode = t.value; return; }
    if (t.id === "exfilter") { S.exFilter = t.value; $("exlist").innerHTML = exListHtml(); return; }
    if (ds.k && draft) {
      draft.rows[ds.ex][+ds.i][ds.k] = t.value; dirty = true; clearTimeout(saveTimer); saveTimer = setTimeout(saveDraft, 900);
      var exo = day() && day().exercises.filter(function (x) { return x.id === ds.ex; })[0], nxe = $("nx-" + ds.ex);
      if (exo && nxe) { var nt = nextText(exo); nxe.hidden = !nt; nxe.firstChild.textContent = nt; }
    }
    else if (ds.lf && S.plan) {
      /* Übungsliste: Änderung gilt für die Übung in allen Trainingstagen. */
      var cur = allExercises().filter(function (x) { return x.ex.id === ds.lid; })[0]; if (!cur) return;
      var le = clone(cur.ex), lv = num(t.value);
      if (ds.lf === "name") le.name = t.value.trim().slice(0, 60) || le.name;
      else if (lv != null && lv > 0) le[ds.lf] = ds.lf === "step" ? lv : Math.min(99, Math.round(lv));
      if (le.repMax < le.repMin) le.repMax = le.repMin;
      setExercise(le); planChanged(false);
      var hb = document.querySelector('[data-act="exopen"][data-id="' + ds.lid + '"]');
      if (hb) { hb.querySelector(".dayname").textContent = le.name; hb.querySelector(".cnt").textContent = exSummary(le); }
    }
    else if (ds.pf && S.plan) {
      var d = S.plan.days[+ds.day];
      if (ds.pf === "dayname") { d.name = t.value.trim() || d.name; var dn = $("dn-" + d.id); if (dn) dn.textContent = d.name; }
      else {
        var e = d.exercises[+ds.exi], v = num(t.value);
        if (ds.pf === "name") e.name = t.value.trim() || e.name;
        else if (v != null && v > 0) e[ds.pf] = ds.pf === "step" ? v : Math.min(99, Math.round(v));
        if (e.repMax < e.repMin) e.repMax = e.repMin;
        /* Dieselbe Übung in einem anderen Tag bekommt dieselben Einstellungen. */
        S.plan.days.forEach(function (d2) { d2.exercises.forEach(function (x) { if (x.id === e.id && x !== e) { x.name = e.name; x.sets = e.sets; x.repMin = e.repMin; x.repMax = e.repMax; x.step = e.step; } }); });
      }
      planChanged(false);
    }
  });
  document.addEventListener("change", function (ev) {
    var t = ev.target;
    if (t.id === "tdate") { saveDraft(); S.date = t.value || today(); draft = null; renderTrain(); }
    else if (t.id === "exsel") { S.exSel = t.value; renderProgress(); }
    else if (t.id === "profsel") switchProfile(t.value);
    else if (t.dataset.pick != null) {
      S.pick = S.pick || {}; S.pick[t.dataset.pick] = t.value; pickMsg[t.dataset.pick] = "";
      if (t.value === "own") { renderPlan(); var pn = $("pickname-" + t.dataset.pick); if (pn) pn.focus(); }
    }
    else if (t.id === "pf-main") { PROF.main = t.value; profFix(); profWrite(); }
    else if (t.dataset.k) saveDraft();
    else if (t.id === "impfile" && t.files && t.files[0]) {
      var fr = new FileReader();
      fr.onload = function () { var m = importText(String(fr.result)); renderAll(true); $("datamsg").textContent = m; };
      fr.onerror = function () { $("datamsg").textContent = "Die Datei konnte nicht gelesen werden."; };
      fr.readAsText(t.files[0]);
    }
  });
  window.addEventListener("pagehide", function () { saveDraft(); if (planTimer) planChanged(true); });
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) { hiddenAt = Date.now(); hiddenDay = today(); saveDraft(); if (planTimer) planChanged(true); return; }
    /* Zurück in der App: nach einem Tageswechsel aufs heutige Datum springen, nach über 3 Stunden Pause neu fragen. */
    if (hiddenDay && hiddenDay !== today()) { S.date = today(); S.dayId = null; draft = null; dirty = false; renderAll(true); }
    if (hiddenAt && Date.now() - hiddenAt > 3 * 36e5 && PROF.list.length > 1 && $("who").hidden) askWho();
  });

  try { var st = localStorage.getItem("trainingslog-tab"); if (st && $("tab-" + st)) showTab(st); } catch (e) {}
  init();
})();
</script>
</body>
</html>
