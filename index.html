<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trainingslog</title>
<meta name="description" content="Trainingstracker mit Steigerungsvorschlägen, Verlaufskurven, Körperwerten und Phasen.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f1f3f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1116" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Trainingslog">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
@font-face { font-family: "Inter"; src: url("inter.woff2") format("woff2"); font-weight: 100 900; font-display: swap }
@font-face { font-family: "Space Grotesk"; src: url("space-grotesk.woff2") format("woff2"); font-weight: 300 700; font-display: swap }
[hidden] { display: none !important }
html { -webkit-text-size-adjust: 100% }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px) }
/* Layout: eine schmale Spalte wie ein Trainingsheft; oben Tabs, darunter pro Übung ein Block mit Satz-Zeilen. */
:root {
  --bg: #f1f3f7; --surface: #ffffff; --sunken: #e8ebf1; --ink: #151a22; --muted: #5a6474; --line: #d6dbe4;
  --accent: #2447d6; --accent-ink: #ffffff; --accent-soft: #e4e9fb;
  --good: #17754a; --good-soft: #dff3e8; --warn: #8a5a00; --warn-soft: #f8ecd0; --bad: #b3261e; --dot: #e0a000; --scrim: rgba(21, 26, 34, .5);
  --c1: #2447d6; --c2: #b4530a; --c3: #17754a; --c4: #8b3fc7; --c5: #b3265c; --c6: #0b7285; --c-ink: #ffffff;
  --display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1116; --surface: #171b22; --sunken: #1f242d; --ink: #e9ecf1; --muted: #9aa4b3; --line: #2b313c;
  --accent: #8ea5ff; --accent-ink: #0c1124; --accent-soft: #1d2647;
  --good: #62d39b; --good-soft: #143325; --warn: #e8b85a; --warn-soft: #3a2c0c; --bad: #ff8a80; --dot: #f5c542; --scrim: rgba(0, 0, 0, .66);
  --c1: #8ea5ff; --c2: #f0a868; --c3: #62d39b; --c4: #c79bf2; --c5: #f28fb1; --c6: #66c9d9; --c-ink: #0e1116; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0e1116; --surface: #171b22; --sunken: #1f242d; --ink: #e9ecf1; --muted: #9aa4b3; --line: #2b313c;
  --accent: #8ea5ff; --accent-ink: #0c1124; --accent-soft: #1d2647;
  --good: #62d39b; --good-soft: #143325; --warn: #e8b85a; --warn-soft: #3a2c0c; --bad: #ff8a80; --dot: #f5c542; --scrim: rgba(0, 0, 0, .66);
  --c1: #8ea5ff; --c2: #f0a868; --c3: #62d39b; --c4: #c79bf2; --c5: #f28fb1; --c6: #66c9d9; --c-ink: #0e1116; color-scheme: dark }

* { box-sizing: border-box }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); font-variant-numeric: tabular-nums; -webkit-tap-highlight-color: transparent }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg) }
.wrap { max-width: 760px; margin: 0 auto; padding-block: 20px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 16px }
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; line-height: 1.2 }
h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.01em }
h2 { font-size: 18px; font-weight: 600 }
h3 { font-size: 16px; font-weight: 600 }
p { margin: 0 }
.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap }
.sync { font-size: 12px; color: var(--muted) }
.sync.err { color: var(--bad) }
.profrow { flex-direction: row; align-items: center; gap: 10px; font-size: 13px }
.profrow select { width: auto; flex: 0 1 240px }
.tabs button { position: relative }
.tabs button.new::after { content: ""; position: absolute; top: 5px; right: 1px; width: 7px; height: 7px; border-radius: 50%; background: var(--dot) }
.overlay { position: fixed; inset: 0; z-index: 20; background: var(--scrim); display: flex; align-items: center; justify-content: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)) }
.sheet { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; width: min(420px, 100%); max-height: 100%; overflow: hidden; display: flex; flex-direction: column; gap: 14px }
.sheet > * { flex: none }
.sheet h2 { font-size: 22px }
.sheet > .stack { display: flex; flex-direction: column; gap: 8px; flex: 0 1 auto; min-height: 0; overflow-y: auto; padding: 3px; margin: -3px }
.stack > * { flex: none }
.whobtn { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 16px; font-size: 17px; text-align: left }
.whobtn span { font-size: 13px; font-weight: 500; opacity: .85 }
.newsitem { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 12px; text-align: left; font-weight: 400; line-height: 1.45 }
.tag { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted) }
.tag::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--dot) }
button:disabled { opacity: .4; cursor: default }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px }
.cal .wd { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); text-align: center; padding-bottom: 2px }
.calday { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; min-height: 52px; padding: 6px 2px; border-radius: 8px; border: 1px solid transparent; background: var(--sunken); color: var(--muted); font-weight: 500 }
.calday .num { font-size: 13px; line-height: 1 }
.calday.has { color: var(--ink); font-weight: 600 }
.calday.today { border-color: var(--accent) }
.calday.sel { background: var(--accent-soft); border-color: var(--accent) }
.pill { display: inline-block; padding: 3px 5px; border-radius: 5px; font-size: 10.5px; font-weight: 700; line-height: 1; letter-spacing: .02em; color: var(--c-ink); background: var(--muted) }
.pill.c1 { background: var(--c1) } .pill.c2 { background: var(--c2) } .pill.c3 { background: var(--c3) }
.pill.c4 { background: var(--c4) } .pill.c5 { background: var(--c5) } .pill.c6 { background: var(--c6) }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px }
.legend span { display: inline-flex; align-items: center; gap: 6px }
.caldet { display: flex; flex-direction: column; gap: 12px; padding-top: 12px; border-top: 1px solid var(--line) }
.calw { display: flex; flex-direction: column; gap: 4px }
.calw button { margin-top: 6px }

.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; gap: 4px; background: var(--bg); padding-block: 6px; overflow-x: auto }
.tabs button { flex: 1 1 auto; white-space: nowrap; border-radius: 0; padding: 10px 6px; border: 0; border-bottom: 2px solid var(--line); background: none; color: var(--muted);
  font: 600 14px var(--body); cursor: pointer }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent) }

section.tab { display: flex; flex-direction: column; gap: 16px }
.block { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0 }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: end }
.row > * { min-width: 0 }
.muted { color: var(--muted) }
.small { font-size: 13px }
.empty { color: var(--muted); padding: 8px 0 }
.note { font-size: 13px; color: var(--warn); background: var(--warn-soft); border-radius: 8px; padding: 8px 10px }

label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 500; color: var(--muted) }
input, select { font: 16px var(--body); color: var(--ink); background: var(--sunken); border: 1px solid transparent; border-radius: 8px; padding: 9px 10px; width: 100%; min-width: 0 }
input::placeholder { color: var(--muted); opacity: .7 }
input:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px }
button { font: 600 14px var(--body); border-radius: 8px; cursor: pointer; padding: 10px 14px; border: 1px solid var(--line); background: var(--surface); color: var(--ink) }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink) }
button.ghost { border-color: transparent; background: none; color: var(--accent); padding: 8px 6px }
button.danger { color: var(--bad) }

.chips { display: flex; gap: 6px; flex-wrap: wrap }
.chips button { padding: 7px 12px; border-radius: 999px; font-weight: 500 }
.chips button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink) }

.exhead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap }
.hint { align-self: flex-start; font-size: 13px; font-weight: 600; padding: 4px 9px; border-radius: 6px }
.hint.up { background: var(--good-soft); color: var(--good) }
.hint.hold { background: var(--accent-soft); color: var(--ink) }
.hint.low { background: var(--warn-soft); color: var(--warn) }
.sets { display: grid; grid-template-columns: 2.2em 1fr 1fr; gap: 8px; align-items: center }
.sets .hd { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted) }
.sets .n { color: var(--muted); font-weight: 600; text-align: center }

.stats { display: flex; gap: 20px; flex-wrap: wrap }
.stats div { display: flex; flex-direction: column }
.stats b { font: 600 20px var(--display) }
.stats span { font-size: 12px; color: var(--muted) }

.chart svg { width: 100%; height: auto; display: block }
.chart .grid { stroke: var(--line); stroke-width: 1 }
.chart .ln { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round }
.chart .ar { fill: var(--accent); opacity: .12 }
.chart .pt { fill: var(--surface); stroke: var(--accent); stroke-width: 2 }
.chart .end { fill: var(--accent) }
.chart text { fill: var(--muted); font: 12px var(--body) }
.chart text.val { fill: var(--ink); font-weight: 600; font-size: 13px }
.chart .mk { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 4 }
.chart text.mkt { font-size: 11px; font-weight: 600 }

.tablewrap { overflow-x: auto }
table { border-collapse: collapse; width: 100%; font-size: 14px }
th, td { text-align: left; padding: 7px 10px 7px 0; border-bottom: 1px solid var(--line); white-space: nowrap }
th { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600 }
td.r, th.r { text-align: right; padding: 7px 0 7px 14px }
td button { padding: 4px 8px; font-size: 13px }

.planex { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr auto; gap: 8px; align-items: end; padding-top: 10px; border-top: 1px solid var(--line) }
.planex .name { grid-column: 1 / -1 }
@media (min-width: 620px) { .planex { grid-template-columns: 2.4fr 1fr 1fr 1fr 1fr auto } .planex .name { grid-column: auto } }
@media (prefers-reduced-motion: no-preference) { button { transition: background-color .12s, border-color .12s } }
button, select, input { touch-action: manipulation }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>Trainingslog</h1>
    <span class="sync" id="sync" role="status">Lade deine Daten …</span>
  </div>
  <label class="profrow" id="profrow" hidden>Profil<select id="profsel"></select></label>

  <div class="tabs" role="tablist">
    <button role="tab" data-tab="train" aria-selected="true">Training</button>
    <button role="tab" data-tab="prog" aria-selected="false">Fortschritt</button>
    <button role="tab" data-tab="body" aria-selected="false">Körper</button>
    <button role="tab" data-tab="plan" aria-selected="false">Plan</button>
    <button role="tab" data-tab="data" aria-selected="false">Daten</button>
  </div>

  <div id="notice" class="note" hidden></div>

  <section class="tab" id="tab-train"><p class="empty">Hier erscheint dein Trainingstag mit allen Übungen, sobald deine Daten geladen sind.</p></section>
  <section class="tab" id="tab-prog" hidden></section>
  <section class="tab" id="tab-body" hidden></section>
  <section class="tab" id="tab-plan" hidden></section>
  <section class="tab" id="tab-data" hidden></section>
</div>

<div class="overlay" id="who" role="dialog" aria-modal="true" aria-labelledby="who-h" hidden>
  <div class="sheet">
    <h2 id="who-h">Wer trainiert?</h2>
    <div class="stack" id="who-list"></div>
  </div>
</div>
<div class="overlay" id="news" role="dialog" aria-modal="true" aria-labelledby="news-h" hidden>
  <div class="sheet">
    <h2 id="news-h">Was ist neu?</h2>
    <p class="small muted">Tippe auf einen Eintrag, um direkt zum Reiter zu springen.</p>
    <div class="stack" id="news-list"></div>
    <button class="primary" data-act="newsok">Verstanden</button>
  </div>
</div>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
  var num = function (s) { s = String(s == null ? "" : s).trim().replace(",", "."); if (s === "") return null; var n = parseFloat(s); return isFinite(n) ? n : null; };
  var fmt = function (n) { return n == null ? "–" : String(Math.round(n * 100) / 100).replace(".", ","); };
  var pad = function (n) { return (n < 10 ? "0" : "") + n; };
  var today = function () { var d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); };
  var dfmt = function (s, yr) { var p = s.split("-"); return p[2] + "." + p[1] + "." + (yr ? p[0].slice(2) : ""); };
  var rid = function (p) { return p + Math.random().toString(36).slice(2, 8); };
  var clone = function (o) { return JSON.parse(JSON.stringify(o)); };

  var S = { ready: false, plan: null, workouts: {}, body: {}, phases: [], person: null, tab: "train", date: today(), dayId: null, exSel: null, metric: "e1rm", bodyMetric: "weight" };
  var draft = null, dirty = false, saveTimer = null, planTimer = null;
  var DOCS = {}, persistAsked = false;
  /* Profile: mehrere Personen auf einem Gerät. Das erste Profil ("main") nutzt die ursprünglichen Speicherschlüssel. */
  var PROF = { active: "main", main: "main", list: [{ id: "main", name: "Profil 1" }] };
  /* Neuerungen: Bei jeder Änderung an der App APP_VERSION um 1 erhöhen und unten einen Eintrag mit dem
     betroffenen Reiter (train, prog, body, plan, data) ergänzen. Nach einem Update zeigt die App die neuen
     Einträge einmal an und markiert die Reiter bis zum nächsten Öffnen mit einem gelben Punkt. */
  var APP_VERSION = 5;
  var CHANGES = [
    { v: 2, tab: "train", text: "Unter jeder Übung steht nach dem letzten Satz ein Vorschlag fürs nächste Mal." },
    { v: 2, tab: "body", text: "Kalorienempfehlung für Cut und Aufbau. Die Angaben dazu trägst du ganz unten ein." },
    { v: 2, tab: "data", text: "Profile für mehrere Personen auf diesem Gerät." },
    { v: 3, tab: "data", text: "Bei mehreren Profilen fragt die App beim Öffnen „Wer trainiert?“ und schlägt den Hauptnutzer vor. Den Hauptnutzer legst du unter „Profile“ fest." },
    { v: 3, tab: "data", text: "Neuerungen sind ab jetzt mit einem gelben Punkt am Reiter markiert. Die ganze Liste findest du unten unter „Was ist neu?“." },
    { v: 4, tab: "train", text: "Der Gewichtsvorschlag kommt jetzt mit unterschiedlichen Gewichten pro Satz zurecht: Er schlägt ein gemeinsames Arbeitsgewicht vor und rät zum Reduzieren, wenn ein Gewicht zu schwer war." },
    { v: 5, tab: "prog", text: "Kalender: zeigt pro Monat, an welchem Tag du welches Training gemacht hast. Ein Tipp auf einen Tag zeigt die Sätze. Er ersetzt die Liste „Letzte Einheiten“." }
  ];
  var TABNAME = { train: "Training", prog: "Fortschritt", body: "Körper", plan: "Plan", data: "Daten" };
  var fresh = [], hiddenAt = 0, hiddenDay = "";
  var keyFor = function (kind, id) { id = id || PROF.active; return id === "main" ? (kind === "data" ? "trainingslog" : "trainingslog-backup") : "trainingslog-" + kind + "-" + id; };
  var profName = function () { var n = ""; PROF.list.forEach(function (p) { if (p.id === PROF.active) n = p.name; }); return n; };

  /* ---------- Speicher ---------- */
  function setSync(t, err) { var el = $("sync"); el.textContent = t; el.classList.toggle("err", !!err); }
  function notice(t) { var el = $("notice"); el.hidden = !t; el.textContent = t || ""; }
  function applyDocs(list) {
    var w = {}, b = {}, plan = null, ph = [], pe = null;
    list.forEach(function (d) {
      if (d.id === "plan") plan = d.data;
      else if (d.id === "settings") { ph = d.data.phases || []; pe = d.data.person || null; }
      else if (d.data.kind === "workout") w[d.id] = d.data;
      else if (d.data.kind === "body") b[d.id] = d.data;
    });
    S.workouts = w; S.body = b; S.phases = ph; S.person = pe;
    if (!planTimer) S.plan = plan;
  }
  function localApply(id, data) {
    if (id === "plan") S.plan = data;
    else if (id === "settings") { S.phases = data ? data.phases : []; S.person = data && data.person || null; }
    else if (id.charAt(0) === "w") { if (data) S.workouts[id] = data; else delete S.workouts[id]; }
    else { if (data) S.body[id] = data; else delete S.body[id]; }
  }
  function lsRead() { try { return JSON.parse(localStorage.getItem(keyFor("data")) || "{}") || {}; } catch (e) { return {}; } }
  function lsWrite(o) { try { localStorage.setItem(keyFor("data"), JSON.stringify(o)); return true; } catch (e) { return false; } }
  function profRead() {
    try {
      var p = JSON.parse(localStorage.getItem("trainingslog-profiles") || "null");
      if (p && Array.isArray(p.list)) {
        var list = p.list.filter(function (x) { return x && IRE.test(x.id); }).map(function (x) { return { id: x.id, name: txt80(x.name).slice(0, 30) || "Profil" }; });
        if (list.length) PROF = { active: p.active, main: p.main, list: list };
      }
    } catch (e) {}
    profFix();
  }
  function profFix() {
    if (!PROF.list.some(function (x) { return x.id === PROF.active; })) PROF.active = PROF.list[0].id;
    if (!PROF.list.some(function (x) { return x.id === PROF.main; })) PROF.main = PROF.list[0].id;
  }
  function profWrite() { try { localStorage.setItem("trainingslog-profiles", JSON.stringify(PROF)); } catch (e) {} }
  function persist() {
    var ok = lsWrite(DOCS);
    setSync(ok ? "Auf diesem Gerät gespeichert" : "Speichern fehlgeschlagen – Speicher voll oder gesperrt", !ok);
    if (ok && !persistAsked && navigator.storage && navigator.storage.persist) { persistAsked = true; navigator.storage.persist().catch(function () {}); }
    return ok;
  }
  function put(id, data) {
    localApply(id, data);
    if (data) DOCS[id] = data; else delete DOCS[id];
    persist();
  }
  function loadAll() {
    DOCS = lsRead();
    applyDocs(Object.keys(DOCS).map(function (k) { return { id: k, data: DOCS[k] }; }));
  }
  function init() {
    var had = false, seen = 0;
    try { had = localStorage.getItem("trainingslog") != null || localStorage.getItem("trainingslog-profiles") != null; seen = Number(localStorage.getItem("trainingslog-seen")) || 0; } catch (e) {}
    profRead(); loadAll(); S.ready = true; setSync("Auf diesem Gerät gespeichert"); renderAll(true);
    if (!seen) seen = had ? 1 : APP_VERSION;
    fresh = CHANGES.filter(function (c) { return c.v > seen; });
    document.querySelectorAll(".tabs button").forEach(function (b) {
      if (fresh.some(function (c) { return c.tab === b.dataset.tab; })) { b.classList.add("new"); b.setAttribute("aria-label", b.textContent + " (neu)"); }
    });
    if (!had) markSeen();
    if (PROF.list.length > 1) askWho(); else showNews(false);
    window.addEventListener("storage", function (ev) {
      if (ev.key && ev.key.indexOf("trainingslog") === 0 && ev.key !== "trainingslog-tab" && ev.key !== "trainingslog-seen") { profRead(); loadAll(); renderAll(false); }
    });
    if ("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("sw.js").catch(function () {});
  }

  /* ---------- Plan-Vorlage ---------- */
  function template() {
    var ex = function (n, s, a, b, st) { return { id: rid("e"), name: n, sets: s, repMin: a, repMax: b, step: st }; };
    return { kind: "plan", days: [
      { id: rid("d"), name: "Oberkörper A", exercises: [ex("Bankdrücken", 3, 6, 10, 2.5), ex("Langhantelrudern", 3, 8, 12, 2.5), ex("Schulterdrücken Kurzhantel", 3, 8, 12, 2), ex("Latzug", 3, 8, 12, 2.5), ex("Seitheben", 3, 12, 15, 1), ex("Trizepsdrücken Kabel", 3, 10, 15, 2.5), ex("Kurzhantel-Curls", 3, 10, 15, 1)] },

  }

  /* ---------- Auswertung ---------- */
  function sortedWorkouts() {
    return Object.keys(S.workouts).map(function (k) { var w = S.workouts[k]; return { id: k, w: w }; })
      .sort(function (a, b) { return a.w.date < b.w.date ? -1 : a.w.date > b.w.date ? 1 : String(a.w.updated || "") < String(b.w.updated || "") ? -1 : 1; });

  /* Doppelte Progression: erst Wiederholungen bis zur Obergrenze steigern, dann Gewicht um „Schritt“ erhöhen. */

    if (top > 0 && best <= ex.repMin - 2 && fit() < top) return { w: fit(), kind: "low", text: "Reduzieren auf " + fmt(fit()) + " kg, " + fmt(top) + " kg sind für " + ex.repMin + "–" + ex.repMax + " Wdh. zu schwer" };

  }
  function advise(ex, date) { var last = lastBefore(ex.id, date); return last ? adviseSets(ex, last.sets) : null; }
  /* Vorschlag fürs nächste Training aus den gerade eingetragenen Sätzen, sobald alle geplanten Sätze stehen. */
  function nextText(ex) {
    if (!draft) return "";

  }
  function setsText(sets) {

    return same ? fmt(sets[0].w || 0) + " kg × " + sets.map(function (s) { return s.r; }).join(" · ")
                : sets.map(function (s) { return fmt(s.w || 0) + "×" + s.r; }).join(" · ");
  }
  function day() { var d = S.plan && S.plan.days; if (!d || !d.length) return null; return d.filter(function (x) { return x.id === S.dayId; })[0] || d[0]; }
  function nextDayId() {

  var wid = function () { return "w_" + S.date + "_" + day().id; };

  /* ---------- Phasen (Aufbau / Cut / Halten) ---------- */
  var PH = { bulk: "Aufbau", cut: "Cut", maintain: "Halten" };
  var RULE = { cut: [0.5, 1], bulk: [0.25, 0.5], maintain: [0, 0.25] }; /* % des Körpergewichts pro Woche */

  function phaseAt(date) { var r = null; S.phases.forEach(function (p) { if (p.start <= date) r = p; }); return r; }
  function weekOf(p, date) { return Math.floor((Date.parse(date) - Date.parse(p.start)) / 864e5 / 7) + 1; }

  }
  function phaseLine() {
    var p = phaseAt(S.date); if (!p) return "";
    var tip = p.type === "cut" ? " Im Cut ist es ein Erfolg, Gewichte und Wiederholungen zu halten." : p.type === "bulk" ? " Im Aufbau sollten Gewicht oder Wiederholungen über die Wochen steigen." : "";
    return '<p class="small muted"><b>' + PH[p.type] + "</b>, Woche " + weekOf(p, S.date) + "." + tip + "</p>";
  }
  function verdict(type, pct) {
    var lo = RULE[type][0], hi = RULE[type][1];
    if (type === "maintain") return Math.abs(pct) <= hi ? ["up", "Gewicht stabil"] : ["low", pct > 0 ? "Gewicht steigt stärker als beim Halten üblich" : "Gewicht sinkt stärker als beim Halten üblich"];
    var v = type === "cut" ? -pct : pct;
    if (v < 0) return ["low", type === "cut" ? "Gewicht steigt, im Cut sollte es sinken" : "Gewicht sinkt, im Aufbau sollte es steigen"];
    if (v < lo) return ["hold", "Langsamer als die Faustregel"];
    if (v <= hi) return ["up", "Im Zielbereich"];

  }
  var ACT = [[1.2, "Kaum Bewegung (Bürojob, kein Sport)"], [1.375, "Leicht aktiv (1–2 Einheiten pro Woche)"], [1.55, "Mäßig aktiv (3–5 Einheiten pro Woche)"], [1.725, "Sehr aktiv (6–7 Einheiten pro Woche)"], [1.9, "Extrem aktiv (körperliche Arbeit plus Training)"]];
  var kc = function (n) { return (Math.round(n / 50) * 50).toLocaleString("de-DE"); };
  function saveSettings(phases, person) { put("settings", { kind: "settings", phases: phases || S.phases, person: person || S.person || null }); }
  /* Gewichtstrend per Ausgleichsgerade über höchstens 28 Tage, frühestens ab `start`. */
  function trendOf(list, start) {
    var t = today(), from = new Date(Date.parse(t) - 28 * 864e5).toISOString().slice(0, 10); if (start && start > from) from = start;
    var ws = list.filter(function (x) { return x.weight != null && x.date >= from && x.date <= t; });

    ws.forEach(function (x) { var d = (Date.parse(x.date) - Date.parse(ws[0].date)) / 864e5; sx += d; sy += x.weight; sxx += d * d; sxy += d * x.weight; });

  }
  /* Kalorienempfehlung. Erhaltungsbedarf: Grundumsatz nach Mifflin-St Jeor × Aktivität. Ist die aktuelle
     Zufuhr bekannt und gibt es dazu mindestens 14 Tage Gewichtsverlauf, wird der Erhaltungsbedarf daraus
     abgeleitet (1 kg pro Woche entspricht rund 1100 kcal pro Tag). Zielbereich wie bei der Trend-Faustregel. */
  function kcalText(type, w, list) {
    var P = S.person;
    if (!P) return '<p class="small muted">Für eine Kalorienempfehlung trag unten unter „Angaben für die Kalorienempfehlung“ Geschlecht, Geburtsjahr, Größe und Aktivität ein.</p>';
    if (w == null) return '<p class="small muted">Für eine Kalorienempfehlung fehlt noch eine Gewichtsmessung.</p>';

    var tr = P.intake && P.since ? trendOf(list, P.since) : null;
    var measured = tr && tr.span >= 14 && tr.n >= 3 ? P.intake - tr.perWeek * 1100 : null;
    if (measured != null && (measured < bmr || measured > formula * 1.6)) measured = null;
    var maint = measured || formula, k = 11 * w, lo = maint, hi = maint, rec = maint, clip = false;
    if (type === "cut") { lo = maint - k; hi = maint - 0.5 * k; rec = hi; }

      (clip ? "Die Untergrenze ist auf deinen Grundumsatz von " + kc(bmr) + " kcal angehoben. " : "") +

  }
  function personForm() {

  }

  /* ---------- Diagramm ---------- */
  function chart(pts, unit, label, marks) {
    if (!pts.length) return "";

    var xs = pts.map(function (p) { return Date.parse(p.d); }), x0 = Math.min.apply(0, xs), x1 = Math.max.apply(0, xs);
    var X = function (t) { return x1 === x0 ? L + (W - L - R) / 2 : L + (t - x0) / (x1 - x0) * (W - L - R); };

    if (lo === hi) { lo -= 1; hi += 1; }

    var xl = pts.length > 1
      ? '<text x="' + L + '" y="' + (H - 8) + '">' + dfmt(pts[0].d, 1) + '</text><text x="' + (W - R) + '" y="' + (H - 8) + '" text-anchor="end">' + dfmt(lp.d, 1) + "</text>"
      : '<text x="' + lx.toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle">' + dfmt(lp.d, 1) + "</text>";
    var mk = "";
    if (pts.length > 1) (marks || []).forEach(function (m) {
      var mx = X(Math.max(x0, Date.parse(m.d)));
      mk += '<line class="mk" x1="' + mx.toFixed(1) + '" x2="' + mx.toFixed(1) + '" y1="' + (T - 8) + '" y2="' + (H - B) + '"/><text class="mkt" x="' + mx.toFixed(1) + '" y="12" text-anchor="' + (mx > W - R - 50 ? "end" : mx < L + 50 ? "start" : "middle") + '">' + esc(m.t) + "</text>";

  }

  /* ---------- Training ---------- */
  function buildDraft() {
    var d = day(); if (!d) { draft = null; return; }
    var stored = S.workouts[wid()], byEx = {};
    (stored && stored.entries || []).forEach(function (e) { byEx[e.exId] = e; });
    draft = { rows: {}, extra: [] };
    d.exercises.forEach(function (ex) {
      var adv = advise(ex, S.date), w = adv ? fmt(adv.w) : "", rows = [];
      if (byEx[ex.id]) { rows = byEx[ex.id].sets.map(function (s) { return { w: s.w == null ? "" : fmt(s.w), r: String(s.r) }; }); w = rows.length ? rows[rows.length - 1].w : w; delete byEx[ex.id]; }

  }
  function saveDraft() {

      var sets = (draft.rows[ex.id] || []).map(function (r) { return { w: num(r.w), r: num(r.r) }; }).filter(function (s) { return s.r > 0; })
        .map(function (s) { return { w: s.w == null ? 0 : s.w, r: Math.round(s.r) }; });
      if (sets.length) entries.push({ exId: ex.id, name: ex.name, sets: sets });
    });
    entries = entries.concat(draft.extra);

      var tries = [[name, type], [name.replace(/\.\w+$/, ".txt"), "text/plain"]];
      for (var i = 0; i < tries.length; i++) {
        var f; try { f = new File([text], tries[i][0], { type: tries[i][1] }); } catch (e) { break; }
        var can = false; try { can = navigator.canShare({ files: [f] }); } catch (e) {}
        if (can) return navigator.share({ files: [f] }).then(function () { return true; }, function (e) { return e && e.name === "AbortError" ? false : download(name, text, type); });
      }
    }
    return Promise.resolve(download(name, text, type));
  }
  function csv(rows) {
    return "﻿" + rows.map(function (r) {
      return r.map(function (c) {
        if (typeof c === "number") return String(Math.round(c * 100) / 100).replace(".", ",");
        c = c == null ? "" : String(c); if (/^[=+\-@]/.test(c)) c = "'" + c;
        return /[";\r\n]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c;
      }).join(";");
    }).join("\r\n");
  }
  function setsCsv() {
    var names = {}, rows = [["Datum", "Trainingstag", "Übung", "Satz", "Gewicht (kg)", "Wiederholungen", "1RM geschätzt (kg)", "Phase"]];
    (S.plan && S.plan.days || []).forEach(function (d) { d.exercises.forEach(function (e) { names[e.id] = e.name; }); });
    sortedWorkouts().forEach(function (o) {
      var ph = phaseAt(o.w.date);
      (o.w.entries || []).forEach(function (e) {
        e.sets.forEach(function (s, i) { rows.push([dlong(o.w.date), o.w.dayName, names[e.exId] || e.name, i + 1, s.w, s.r, s.r === 1 ? s.w : s.w * (1 + s.r / 30), ph ? PH[ph.type] : ""]); });
      });
    });
    return csv(rows);
  }
  function bodyCsv() {
    var rows = [["Datum"].concat(BM.map(function (f) { return f[1] + " (" + f[2] + ")"; }), ["Phase"])];
    Object.keys(S.body).sort().forEach(function (k) {
      var b = S.body[k], ph = phaseAt(b.date);
      rows.push([dlong(b.date)].concat(BM.map(function (f) { return bodyVal(b, f[0]); }), [ph ? PH[ph.type] : ""]));
    });
    return csv(rows);
  }
  function renderData() {
    var el = $("tab-data"); if (!S.ready) return;
    var lb = lastBackup(), ld = lb ? new Date(lb) : null, old = $("datamsg") ? $("datamsg").textContent : "";
    el.innerHTML = '<div class="block"><h2>Backup</h2><p class="small muted">Deine Einträge liegen nur auf diesem Gerät. Ein Backup ist eine Datei, die du zum Beispiel in iCloud Drive ablegst. Damit stellst du deine Daten wieder her oder überträgst sie auf ein anderes Gerät.' + (PROF.list.length > 1 ? " Backup, Einspielen und Export gelten für das aktive Profil „" + esc(profName()) + "“." : "") + "</p>" +
      "<p>Letztes Backup: <b>" + (ld ? pad(ld.getDate()) + "." + pad(ld.getMonth() + 1) + "." + ld.getFullYear() : "noch keins") + "</b></p>" +
      '<div class="row"><button class="primary" data-act="backup">Backup speichern</button><button data-act="pick">Backup einspielen</button><input type="file" id="impfile" accept=".json,.txt,application/json,text/plain" hidden></div>' +
      '<p class="small muted" id="datamsg">' + esc(old || "Beim Einspielen werden die Einträge aus der Datei ergänzt. Gibt es einen Tag schon, gilt die Version aus der Datei.") + "</p></div>" +
      '<div class="block"><h2>Export für Excel</h2><p class="small muted">CSV-Dateien mit einer Zeile pro Satz bzw. pro Messung, die Excel direkt öffnet.</p><div class="row"><button data-act="csvsets">Sätze exportieren</button><button data-act="csvbody">Körperwerte exportieren</button></div></div>' +
      profileBlock() + '<div class="row" style="align-items:center;justify-content:space-between"><span class="small muted" id="datacount">' + Object.keys(S.workouts).length + " Einheiten und " + Object.keys(S.body).length + " Messungen gespeichert · Version " + APP_VERSION + '</span><button class="ghost" data-act="news">Was ist neu?</button></div>';
  }
  function topNotice() {
    var ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Mac/.test(navigator.platform));
    var app = navigator.standalone === true || (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
    var lb = lastBackup(), days = lb ? Math.floor((Date.now() - Date.parse(lb)) / 864e5) : 0, nW = Object.keys(S.workouts).length;
    if (ios && !app) notice("Zum Installieren: in Safari auf „Teilen“ tippen, dann „Zum Home-Bildschirm“. Trag deine Daten erst in der installierten App ein, sie speichert getrennt von Safari.");
    else if (lb ? days > 14 : nW >= 3) notice(lb ? "Dein letztes Backup ist " + days + " Tage alt. Sichere deine Daten im Tab „Daten“." : "Du hast noch kein Backup. Sichere deine Daten im Tab „Daten“, sie liegen nur auf diesem Gerät.");
    else notice("");
  }

  /* ---------- Profile ---------- */
  function profileBlock() {
    return '<div class="block"><h2>Profile</h2><p class="small muted">Für mehrere Personen auf diesem Gerät. Jedes Profil hat einen eigenen Plan, eigene Einheiten, Körperwerte, Phasen und Kalorienangaben.</p><div class="tablewrap"><table><tbody>' +
      PROF.list.map(function (p) {
        var on = p.id === PROF.active;
        return "<tr><td>" + esc(p.name) + '</td><td class="r">' + (on ? '<span class="muted">aktiv</span>' : '<button data-act="pfswitch" data-id="' + p.id + '">Wechseln</button> <button class="danger" data-act="pfdel" data-id="' + p.id + '">Löschen</button>') + "</td></tr>";
      }).join("") + "</tbody></table></div>" +
      (PROF.list.length > 1 ? '<label>Hauptnutzer (wird beim Öffnen vorgeschlagen)<select id="pf-main">' + PROF.list.map(function (p) { return '<option value="' + p.id + '"' + (p.id === PROF.main ? " selected" : "") + ">" + esc(p.name) + "</option>"; }).join("") + "</select></label>" : "") +
      '<div class="row"><label style="flex:1 1 170px">Name des aktiven Profils<input id="pf-name" autocomplete="off" maxlength="30" value="' + esc(profName()) + '"></label><button data-act="pfrename">Umbenennen</button></div>' +
      '<div class="row"><label style="flex:1 1 170px">Neues Profil<input id="pf-new" autocomplete="off" maxlength="30" placeholder="Name"></label><button data-act="pfadd">Anlegen</button></div></div>';
  }
  function renderProfSel() {
    $("profrow").hidden = PROF.list.length < 2;
    $("profsel").innerHTML = PROF.list.map(function (p) { return '<option value="' + p.id + '"' + (p.id === PROF.active ? " selected" : "") + ">" + esc(p.name) + "</option>"; }).join("");
  }
  function switchProfile(id) {
    if (!PROF.list.some(function (p) { return p.id === id; })) return;
    saveDraft(); if (planTimer) planChanged(true);
    PROF.active = id; profWrite(); loadAll();
    S.date = today(); S.dayId = null; S.exSel = null; S.calSel = null; draft = null; dirty = false;
    if ($("datamsg")) $("datamsg").textContent = "";
    renderAll(true); setSync("Profil „" + profName() + "“ geladen");
  }

  /* „Wer trainiert?“: erscheint bei mehreren Profilen beim Start und nach längerer Pause, Hauptnutzer zuerst. */
  function askWho() {
    var list = PROF.list.slice().sort(function (a, b) { return (b.id === PROF.main) - (a.id === PROF.main); });
    $("who-list").innerHTML = list.map(function (p) {
      var m = p.id === PROF.main;
      return '<button class="whobtn' + (m ? " primary" : "") + '" data-act="who" data-id="' + p.id + '">' + esc(p.name) + (m ? "<span>Hauptnutzer</span>" : "") + "</button>";
    }).join("");
    $("who").hidden = false;
    var f = $("who-list").querySelector("button"); if (f) f.focus();
  }
  function markSeen() { try { localStorage.setItem("trainingslog-seen", String(APP_VERSION)); } catch (e) {} }
  function showNews(all) {
    var list = all ? CHANGES.slice().reverse() : fresh;
    if (!list.length) return;
    $("news-list").innerHTML = list.map(function (c) { return '<button class="newsitem" data-act="newsgo" data-id="' + c.tab + '"><span class="tag">' + TABNAME[c.tab] + "</span><span>" + esc(c.text) + "</span></button>"; }).join("");
    $("news").hidden = false;
  }

  /* ---------- Rendern & Events ---------- */
  function focusIn(id) { var a = document.activeElement; return a && $(id).contains(a) && /INPUT|SELECT/.test(a.tagName); }
  function renderAll(force) {
    if (force || (!dirty && !saveTimer && !focusIn("tab-train"))) { if (!dirty) draft = null; renderTrain(); }
    renderProgress();
    renderBody(!force);
    if (force || (!planTimer && !focusIn("tab-plan"))) renderPlan();
    renderData(); renderProfSel(); topNotice();
  }
  function showTab(t) {
    saveDraft(); S.tab = t;
    ["train", "prog", "body", "plan", "data"].forEach(function (k) { $("tab-" + k).hidden = k !== t; });
    document.querySelectorAll(".tabs button").forEach(function (b) { b.setAttribute("aria-selected", String(b.dataset.tab === t)); });
    if (t === "train") { draft = null; renderTrain(); } else if (t === "prog") renderProgress(); else if (t === "plan") renderPlan(); else if (t === "data") renderData();
    topNotice();
    try { localStorage.setItem("trainingslog-tab", t); } catch (e) {}
  }
  function arm(btn, txt) {
    if (btn.dataset.armed) return true;
    btn.dataset.armed = "1"; var old = btn.textContent; btn.textContent = txt;
    setTimeout(function () { if (btn.isConnected) { delete btn.dataset.armed; btn.textContent = old; } }, 4000);
    return false;
  }

  document.addEventListener("click", function (ev) {
    var b = ev.target.closest("button"); if (!b) return;
    if (b.dataset.tab) return showTab(b.dataset.tab);
    var a = b.dataset.act, id = b.dataset.id; if (!a) return;
    if (a === "tpl" || a === "blank") { S.plan = a === "tpl" ? template() : { kind: "plan", days: [{ id: rid("d"), name: "Tag 1", exercises: [] }] }; planChanged(true); renderAll(true); if (a === "blank") showTab("plan"); }
    else if (a === "day") { saveDraft(); S.dayId = id; draft = null; renderTrain(); }
    else if (a === "move") {
      saveDraft();
      var nd = $("mvdate").value, oldId = wid(), cur0 = S.workouts[oldId], newId = "w_" + nd + "_" + day().id;
      if (!nd || !cur0 || nd === S.date) { $("mvmsg").textContent = "Wähle zuerst ein anderes Datum."; return; }
      if (S.workouts[newId]) { $("mvmsg").textContent = "Am " + dfmt(nd, 1) + " gibt es für diesen Trainingstag schon einen Eintrag."; return; }
      var moved = clone(cur0); moved.date = nd; moved.updated = new Date().toISOString();
      put(newId, moved); put(oldId, null); S.date = nd; draft = null; renderTrain(); renderProgress();
    }
    else if (a === "addset") { var rows = draft.rows[id], l = rows[rows.length - 1]; rows.push({ w: l ? l.w : "", r: "" }); renderTrain(); var el = $("r-" + id + "-" + (rows.length - 1)); if (el) el.focus(); }
    else if (a === "metric") { S.metric = id; renderProgress(); }
    else if (a === "open") { S.date = b.dataset.date; S.dayId = id; showTab("train"); }
    else if (a === "calsel") { S.calSel = S.calSel === id ? null : id; renderProgress(); }
    else if (a === "calnav") {
      var cm = new Date(+S.calMonth.slice(0, 4), +S.calMonth.slice(5, 7) - 1 + (+id), 1);
      S.calMonth = cm.getFullYear() + "-" + pad(cm.getMonth() + 1); S.calSel = null; renderProgress();
    }
    else if (a === "calnew") { S.date = id; S.dayId = null; showTab("train"); }
    else if (a === "bmetric") { S.bodyMetric = id; renderBody(true); }
    else if (a === "bsave") {
      var date = $("b-date").value || today(), cur = clone(S.body["b_" + date] || { kind: "body", date: date }), any = false;
      BF.forEach(function (f) { var v = num($("b-" + f[0]).value); if (v != null) { cur[f[0]] = v; any = true; } });
      if (!any) { $("bmsg").textContent = "Trag mindestens einen Wert ein."; return; }
      put("b_" + date, cur); BF.forEach(function (f) { $("b-" + f[0]).value = ""; });
      $("bmsg").textContent = "Messung vom " + dfmt(date, 1) + " gespeichert."; renderBody(true);
    }
    else if (a === "bdel") { if (arm(b, "Sicher?")) { put(id, null); renderBody(true); } }
    else if (a === "who") { $("who").hidden = true; if (id !== PROF.active) switchProfile(id); showNews(false); }
    else if (a === "news") showNews(true);
    else if (a === "newsok" || a === "newsgo") { $("news").hidden = true; fresh = []; markSeen(); if (a === "newsgo") showTab(id); }
    else if (a === "pesave") {
      var sx = $("pe-sex").value, yr = num($("pe-year").value), hg = num($("pe-height").value), ac = num($("pe-act").value), it = num($("pe-intake").value), age = new Date().getFullYear() - yr;
      if (!sx || !yr || age > 100 || age < 0 || !hg || hg < 120 || hg > 230 || !ac) { $("pemsg").textContent = "Bitte Geschlecht, Geburtsjahr, Größe in cm und Aktivität angeben."; return; }
      if (age < 18) { $("pemsg").textContent = "Die Kalorienempfehlung ist nur für Erwachsene ausgelegt."; return; }
      if (it != null && (it < 800 || it > 8000)) { $("pemsg").textContent = "Die Kalorienangabe sieht nicht plausibel aus."; return; }
      saveSettings(null, { sex: sx, year: Math.round(yr), height: hg, act: ac, intake: it == null ? null : Math.round(it), since: it == null ? null : ($("pe-since").value || today()) });
      $("pemsg").textContent = "Gespeichert. Die Empfehlung steht oben bei der Phase."; renderBody(true);
    }
    else if (a === "pfswitch") switchProfile(id);
    else if (a === "pfadd") {
      var pn = { id: rid("p"), name: $("pf-new").value.trim().slice(0, 30) || "Profil " + (PROF.list.length + 1) };
      PROF.list.push(pn); switchProfile(pn.id);
    }
    else if (a === "pfrename") {
      var rn = $("pf-name").value.trim().slice(0, 30);
      if (rn) { PROF.list.forEach(function (p) { if (p.id === PROF.active) p.name = rn; }); profWrite(); renderData(); renderProfSel(); }
    }
    else if (a === "pfdel") {
      if (id !== PROF.active && PROF.list.some(function (p) { return p.id === id; }) && arm(b, "Mit allen Daten löschen?")) {
        try { localStorage.removeItem(keyFor("data", id)); localStorage.removeItem(keyFor("backup", id)); } catch (e) {}
        PROF.list = PROF.list.filter(function (p) { return p.id !== id; }); profFix(); profWrite(); renderData(); renderProfSel();
      }
    }
    else if (a === "backup") {
      if (planTimer) planChanged(true);
      var slug = PROF.list.length > 1 ? (profName().toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "profil") + "-" : "";
      deliver("trainingslog-backup-" + slug + today() + ".json", JSON.stringify({ app: "trainingslog", version: 1, profile: profName(), exported: new Date().toISOString(), docs: DOCS }), "application/json").then(function (ok) {
        if (!ok) return;
        try { localStorage.setItem(keyFor("backup"), new Date().toISOString()); } catch (e) {}
        renderData(); $("datamsg").textContent = "Backup erstellt. Leg die Datei außerhalb dieses Geräts ab, zum Beispiel in iCloud Drive."; topNotice();
      });
    }
    else if (a === "pick") $("impfile").click();
    else if (a === "csvsets") deliver("trainingslog-saetze-" + today() + ".csv", setsCsv(), "text/csv");
    else if (a === "csvbody") deliver("trainingslog-koerper-" + today() + ".csv", bodyCsv(), "text/csv");
    else if (a === "phstart") {
      var pt = $("ph-type").value, pd = $("ph-date").value || today(), act = phaseAt(pd);
      if (act && act.type === pt && act.start !== pd) { $("phmsg").textContent = "Am " + dfmt(pd, 1) + " läuft bereits die Phase „" + PH[pt] + "“."; return; }
      var np = S.phases.filter(function (p) { return p.start !== pd; }); np.push({ start: pd, type: pt });
      np.sort(function (x, y) { return x.start < y.start ? -1 : 1; });
      saveSettings(np); $("phmsg").textContent = PH[pt] + " ab " + dfmt(pd, 1) + " gespeichert."; renderAll(false);
    }
    else if (a === "phdel") { if (arm(b, "Sicher?")) { saveSettings(S.phases.filter(function (p) { return p.start !== id; })); renderAll(false); } }
    else if (a === "addd") { S.plan.days.push({ id: rid("d"), name: "Neuer Tag", exercises: [] }); planChanged(true); renderPlan(); }
    else if (a === "deld") { if (arm(b, "Sicher löschen?")) { S.plan.days.splice(+id, 1); planChanged(true); renderPlan(); } }
    else if (a === "adde") { var e = { id: rid("e"), name: "Neue Übung", sets: 3, repMin: 8, repMax: 12, step: 2.5 }; S.plan.days[+id].exercises.push(e); planChanged(true); renderPlan(); var n = $("p-" + e.id + "-name"); if (n) { n.focus(); n.select(); } }
    else if (a === "dele") { if (arm(b, "Sicher?")) { S.plan.days[+b.dataset.day].exercises.splice(+id, 1); planChanged(true); renderPlan(); } }
  });

  document.addEventListener("input", function (ev) {
    var t = ev.target, ds = t.dataset;
    if (ds.k && draft) {
      draft.rows[ds.ex][+ds.i][ds.k] = t.value; dirty = true; clearTimeout(saveTimer); saveTimer = setTimeout(saveDraft, 900);
      var exo = day() && day().exercises.filter(function (x) { return x.id === ds.ex; })[0], nxe = $("nx-" + ds.ex);
      if (exo && nxe) { var nt = nextText(exo); nxe.hidden = !nt; nxe.firstChild.textContent = nt; }
    }
    else if (ds.pf && S.plan) {
      var d = S.plan.days[+ds.day];
      if (ds.pf === "dayname") d.name = t.value.trim() || d.name;
      else {
        var e = d.exercises[+ds.exi], v = num(t.value);
        if (ds.pf === "name") e.name = t.value.trim() || e.name;
        else if (v != null && v > 0) e[ds.pf] = ds.pf === "step" ? v : Math.min(99, Math.round(v));
        if (e.repMax < e.repMin) e.repMax = e.repMin;
      }
      planChanged(false);
    }
  });
  document.addEventListener("change", function (ev) {
    var t = ev.target;
    if (t.id === "tdate") { saveDraft(); S.date = t.value || today(); draft = null; renderTrain(); }
    else if (t.id === "exsel") { S.exSel = t.value; renderProgress(); }
    else if (t.id === "profsel") switchProfile(t.value);
    else if (t.id === "pf-main") { PROF.main = t.value; profFix(); profWrite(); }
    else if (t.dataset.k) saveDraft();
    else if (t.id === "impfile" && t.files && t.files[0]) {
      var fr = new FileReader();
      fr.onload = function () { var m = importText(String(fr.result)); renderAll(true); $("datamsg").textContent = m; };
      fr.onerror = function () { $("datamsg").textContent = "Die Datei konnte nicht gelesen werden."; };
      fr.readAsText(t.files[0]);
    }
  });
  window.addEventListener("pagehide", function () { saveDraft(); if (planTimer) planChanged(true); });
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) { hiddenAt = Date.now(); hiddenDay = today(); saveDraft(); if (planTimer) planChanged(true); return; }
    /* Zurück in der App: nach einem Tageswechsel aufs heutige Datum springen, nach über 3 Stunden Pause neu fragen. */
    if (hiddenDay && hiddenDay !== today()) { S.date = today(); S.dayId = null; draft = null; dirty = false; renderAll(true); }
    if (hiddenAt && Date.now() - hiddenAt > 3 * 36e5 && PROF.list.length > 1 && $("who").hidden) askWho();
  });

  try { var st = localStorage.getItem("trainingslog-tab"); if (st && $("tab-" + st)) showTab(st); } catch (e) {}
  init();
})();
</script>
</body>
</html>
